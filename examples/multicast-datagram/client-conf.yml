default-session-authn:
  rules:
    - prin: server
      cred:
        unix: bus-example-server-datagram.sock

    - prin: server
      cred:
        unsafe:
          ip: '[::1]:9119'

  unsafe:
    allow-ip-addr-creds: true

channels:
  - id: client-udp
    udp:
      addr: '[::0]:9229'
      unsafe:
        allow-ip-addr-creds: true

  - id: client-unix
    unix-datagram:
      path: bus-example-client-datagram.sock

parties:
  - party: client
    connections:
      - channel-names:
          - client-udp

        endpoints:
          - addr:
              udp: '[::1]:9229'

      - channel-names:
          - client-unix

        endpoints:
          - addr:
              unix-datagram: bus-example-client-datagram.sock

  - party: server
    connections:
      - channel-names:
          - client-udp

        endpoints:
          - addr:
              udp: '[::1]:9119'

      - channel-names:
          - client-unix

        endpoints:
          - addr:
              unix-datagram: bus-example-server-datagram.sock

msg-authn: null

self: client
