default-session-authn:
  rules:
    - prin: client
      cred:
        unix: bus-example-client-large-obj.sock

    - prin: client
      cred:
        unsafe:
          ip: '[::1]:9449'

  unsafe:
    allow-ip-addr-creds: true

channels:
  - id: server-udp
    udp:
      addr: '[::0]:9339'
      unsafe:
        allow-ip-addr-creds: true

  - id: server-unix
    unix-datagram:
      path: bus-example-server-large-obj.sock

msg-authn: null
