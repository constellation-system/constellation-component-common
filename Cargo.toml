[package]
name = "constellation-component-common"
description = "Common APIs, datatypes, and functionality for Constellation Components"
repository = "https://github.com/constellation-system/constellation-component-common"
edition = "2024"
version = "0.0.0"
authors = [ "Eric McCorkle <eric.mccorkle@jhuapl.edu>" ]
license = "AGPL-3.0-only"
keywords = ["networking", "distributed systems", "consensus"]
categories = ["network-programming"]
exclude = [
    ".gitignore"
]

[features]
default = ["dtls", "gssapi", "log", "openssl", "socks5", "tls", "unix"]
dtls = ["constellation-channels/dtls"]
gssapi = ["constellation-auth/gssapi",
          "constellation-channels/gssapi",
          "constellation-common/gssapi",
          "constellation-streams/gssapi"]
log = ["dep:log",
       "constellation-auth/log",
       "constellation-channels/log",
       "constellation-common/log",
       "constellation-streams/log"]
openssl = ["constellation-auth/openssl",
           "constellation-channels/openssl",
           "constellation-common/openssl",
           "constellation-streams/openssl"]
socks5 = ["constellation-channels/socks5"]
tls = ["constellation-channels/tls"]
unix = ["constellation-auth/unix",
        "constellation-channels/unix",
        "constellation-common/unix",
        "constellation-streams/unix"]

[dependencies]
asn1rs = { version = "0.3" }
constellation-auth = { git = "https://github.com/constellation-system/constellation-auth.git", branch = "project/ioc", default-features = false }
constellation-channels = { git = "https://github.com/constellation-system/constellation-channels.git", branch = "project/ioc", default-features = false }
constellation-common = { git = "https://github.com/constellation-system/constellation-common.git", branch = "project/ioc", default-features = false }
constellation-streams = { git = "https://github.com/constellation-system/constellation-streams.git", branch = "project/ioc", default-features = false }
log = { version = "0.4", optional = true }
mio = { version = "1.0" }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.16", features = ["v5"] }

[build-dependencies]
asn1rs = { version = "0.3" }

[dev-dependencies]
env_logger = { version = "0.10" }
yaml_serde = { version = "0.10" }
